# All methods share this packet input, timeline and feature encoder.
dataset:
  name: cse-cic-ids2018
  packet_file: null
  label_column: label
timeline:
  order: timestamp
  source_end: null
  adapter_end: null
features:
  window_seconds: 5.0
  sequence_length: 5
  sampled_sessions: 100
  session_timeout_seconds: 30.0
  history_windows: 10
  dft:
    c_min: 0
    c_max: 10
  autoencoder:
    channels: 16
    residual_blocks: 2
    latent_dim: 8
    epochs: 20
    batch_size: 128
    learning_rate: 0.001
model:
  hidden:
  - 8
  - 4
labeler:
  type: dnn
  hidden:
  - 128
  - 64
  - 32
  - 16
  - 8
stream:
  buffer_windows: 100
training:
  epochs: 30
  batch_size: 512
  learning_rate: 0.01
trigger:
  threshold: 0.2
  drop_threshold: 0.15
  consecutive_windows: 2
runtime:
  device: cpu
  seed: 42
  threads: 1
siteguard:
  classifier:
    nu: 0.1
    tolerance: 0.0001
    max_iterations: 100000
