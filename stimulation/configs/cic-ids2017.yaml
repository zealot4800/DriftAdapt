dataset:
  name: cic-ids2017
  files: [../data/cic-ids2017.csv]
  # Preserve original per-workload standardization after CSV consolidation.
  preprocessing_segments: [7000, 9000]
  feature_names:
    [Flow IAT Min, Flow IAT Max, Flow IAT Mean, Min Packet Length,
     Max Packet Length, Packet Length Mean, total packet length,
     number of packets, SYN Flag Count, ACK Flag Count, PSH Flag Count,
     FIN Flag Count, RST Flag Count, ECE Flag Count, Flow Duration,
     Destination Port]
  label_column: label
  num_classes: 2
  standardize: true
  normalize: false
model:
  class: ID_CIC_IDS2017_small_pforest
  checkpoint: ../checkpoint/cic-ids2017-in-network-dnn.pt
labeler:
  type: dnn
  class: ID_CIC_IDS2017_large_pforest
  checkpoint: ../checkpoint/cic-ids2017-labeler-dnn.pt
stream: {window_size: 100}
training: {epochs: 30, batch_size: 512, learning_rate: 0.01, optimizer: Adam, balance_binary: true}
adaptation:
  impact_threshold: 0.30
driftadapt:
  mode: driftadapt_selective
  min_labeled_samples: 64
  full_retrain_threshold: 0.70
  parameter_bits: 32
sample_selection: {enabled: true, max_samples: 64}
labeling:
  confidence_threshold: 0.95
  ood_threshold: 0.30
  fallback: oracle
replay: {enabled: true, capacity: 1000, samples_per_update: 256}
validation: {enabled: true, max_f1_drop: 0.02}
drift:
  bins: 16
  threshold: 0.10
  consecutive_windows: 3
  reference_windows: 10
drift_injection:
  enabled: false
  start_window: 71
  end_window: null  # Required for gradual and recurrent drift.
  type: abrupt
  feature_indices: [0, 1, 2]
  feature_names: []
  magnitude: 2.0
# Used only by the baseline_caravan accuracy-proxy path.
trigger:
  type: accuracy_proxy
  threshold: 0.20
  drop_threshold: 0.15
  consecutive_windows: 2
runtime: {device: cuda, seed: 42}
output: {directory: results}
