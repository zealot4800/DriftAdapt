dataset:
  name: cic-ids2017
  files: [../data/cic-ids2017.csv]
  # Preserve original per-workload standardization after CSV consolidation.
  preprocessing_segments: [7000, 9000]
  feature_names:
    [Flow IAT Min, Flow IAT Max, Flow IAT Mean, Min Packet Length,
     Max Packet Length, Packet Length Mean, total packet length,
     number of packets, SYN Flag Count, ACK Flag Count, PSH Flag Count,
     FIN Flag Count, RST Flag Count, ECE Flag Count, Flow Duration,
     Destination Port]
  label_column: label
  num_classes: 2
  standardize: true
  normalize: false
model:
  class: ID_CIC_IDS2017_small_pforest
  simulation_class: ID_CIC_IDS2017_elastic_pforest
  checkpoint: ../checkpoint/cic-ids2017-in-network-dnn.pt
labeler:
  type: dnn
  class: ID_CIC_IDS2017_large_pforest
  checkpoint: ../checkpoint/cic-ids2017-labeler-dnn.pt
stream: {window_size: 100}
training: {epochs: 30, batch_size: 512, learning_rate: 0.01, optimizer: Adam, balance_binary: true}
driftadapt:
  mode: caravan
  parameter_bits: 32
drift_conditioned:
  adapter_checkpoint: ../checkpoint/cic-ids2017-drift-adapter.pt
  simulation_adapter_checkpoint: ../checkpoint/cic-ids2017-capacity-drift-adapter.pt
  confidence_threshold: 0.50
  module_threshold: 0.50
  signature_shift_clip: 8.0
feature_reconfiguration:
  enabled: true
  active_feature_budget: 16
  minimum_oracle_gain: 0.02
  max_candidate_masks: 32
capacity:
  enabled: true
  initial_layer1: 8
  initial_layer2: 4
  max_layer1: 16
  max_layer2: 8
  residual_f1_threshold: 0.05
  saturation_threshold: 0.75
  layer1_expand_step: 2
  layer2_expand_step: 1
  min_improvement: 0.0
  contraction_enabled: true
  contraction_utility_threshold: 0.01
  contraction_patience: 10
  initialization_noise: 0.001
drift:
  bins: 16
  threshold: 0.10
  consecutive_windows: 3
  reference_windows: 10
drift_injection:
  enabled: false
  start_window: 71
  end_window: null  # Required for gradual and recurrent drift.
  type: abrupt
  feature_indices: [0, 1, 2]
  feature_names: []
  magnitude: 2.0
# Used only by the CARAVAN accuracy-proxy path.
trigger:
  type: accuracy_proxy
  threshold: 0.20
  drop_threshold: 0.15
  consecutive_windows: 2
runtime: {device: cuda, seed: 42}
output: {directory: results}

# SiteGuard uses packet metadata; bundled flow CSVs can be audited only.
siteguard:
  action: infer
  source_packets: null
  evaluation_packets: null
  feedback: null
  verified_benign_source: false
  checkpoint: ../checkpoint/cic-ids2017-siteguard.pt
  threads: 1
  # Paper: https://netsyscode.github.io/netsyslab/papers/isp-centric-ids.pdf
  features:
    window_seconds: 5.0
    sequence_length: 5
    sampled_sessions: 100
    session_timeout_seconds: 30.0
    history_windows: 10
    zero_baseline_epsilon: 0.000001
    # Table 4 order. Within each base feature: count, rate, baseline, deviation.
    granularities: [dst_ip, dst_port, src_dst_ip, src_sock, dst_sock]
    measurements: [pkts, bytes, ports, src_ips]
    sequence_order: [packet_size, interval_time, jitter, protocol, payload_size]
    # Optional supplied session semantics; never guessed from encrypted bytes.
    tls_enabled: false
    tls_fields: [tls_has_heartbeat, tls_cipher_suites_cnt, tls_extensions_cnt,
                 tls_has_SNI, tls_sup_heartbeat, cert_self_signed,
                 cert_validity_duration, cert_SNI_in_SAN]
    # Underspecified in the paper: sum packet/byte groups, max cardinalities.
    group_reduction: [sum, sum, max, max]
    short_window_policy: zero_pad_embeddings
    window_label_policy: any_attack
  dft:
    norm: backward
    frequency_order: paper_one_based
    c_min: 0
    c_max: 10
    clip: true
  autoencoder:
    channels: 16
    residual_blocks: 2
    latent_dim: 8
    epochs: 20
    batch_size: 128
    learning_rate: 0.001
  classifier:
    # Explicit correction of the malformed Eq. (1), explained in README.
    objective: slack_corrected_linear
    nu: 0.1
    tolerance: 0.0001
    max_iterations: 100000
  online:
    beta: 0.10
    delta: 0.05
    feedback_window: 100
    minimum_benign_feedback: 10
    learning_rate: 0.01
    schedule: inverse_sqrt
  server:
    # SUM count slots, MAX rate/baseline/deviation slots; fixed victim vocabulary
    # is supplied by the caller from source data, with a final unknown-victim slot.
    digest_fields: [packets, bytes]
