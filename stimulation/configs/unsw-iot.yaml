dataset:
  name: unsw-iot
  files: [../data/unsw-iot.csv]
  # Preserve original per-workload standardization after CSV consolidation.
  preprocessing_segments: [6000, 108000]
  feature_names:
    [Dur, SrcBytes, DstBytes, sTtl, dTtl, SrcLoad, DstLoad, SrcPkts,
     DstPkts, sMeanPktSz, dMeanPktSz, SIntPkt, DIntPkt, TcpRtt, SynAck, AckDat]
  label_column: label
  generated_label_column: generated_label
  num_classes: 10
  standardize: true
  normalize: false
model:
  class: UNSW_IoT_N3IC
  simulation_class: UNSW_IoT_elastic_N3IC
  kwargs: {input_shape: 16, neurons: [64, 32, 10]}
  checkpoint: ../checkpoint/unsw-iot-in-network-dnn-5-classes.pt
labeler: {type: device_list}
stream: {window_size: 1000}
training: {epochs: 30, batch_size: 512, learning_rate: 0.01, optimizer: Adam, balance_binary: false}
driftadapt:
  mode: caravan
  parameter_bits: 32
drift_conditioned:
  adapter_checkpoint: ../checkpoint/unsw-iot-drift-adapter.pt
  simulation_adapter_checkpoint: ../checkpoint/unsw-iot-capacity-drift-adapter.pt
  confidence_threshold: 0.50
  module_threshold: 0.50
  signature_shift_clip: 8.0
feature_reconfiguration:
  enabled: true
  active_feature_budget: 16
  minimum_oracle_gain: 0.02
  max_candidate_masks: 32
capacity:
  enabled: true
  initial_layer1: 64
  initial_layer2: 32
  max_layer1: 128
  max_layer2: 64
  residual_f1_threshold: 0.05
  saturation_threshold: 0.75
  layer1_expand_step: 16
  layer2_expand_step: 8
  min_improvement: 0.0
  contraction_enabled: true
  contraction_utility_threshold: 0.01
  contraction_patience: 10
  initialization_noise: 0.001
drift:
  bins: 16
  threshold: 0.10
  consecutive_windows: 3
  reference_windows: 5
drift_injection:
  enabled: false
  start_window: 7
  end_window: null  # Required for gradual and recurrent drift.
  type: abrupt
  feature_indices: [0, 1]
  feature_names: []
  magnitude: 2.0
# Used only by the CARAVAN accuracy-proxy path.
trigger:
  type: accuracy_proxy
  threshold: 0.30
runtime: {device: cuda, seed: 42}
output: {directory: results}
