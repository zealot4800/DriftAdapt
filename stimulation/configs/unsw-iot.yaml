dataset:
  name: unsw-iot
  files: [../data/unsw-iot.csv]
  # Preserve original per-workload standardization after CSV consolidation.
  preprocessing_segments: [6000, 108000]
  feature_names:
    [Dur, SrcBytes, DstBytes, sTtl, dTtl, SrcLoad, DstLoad, SrcPkts,
     DstPkts, sMeanPktSz, dMeanPktSz, SIntPkt, DIntPkt, TcpRtt, SynAck, AckDat]
  label_column: label
  generated_label_column: generated_label
  num_classes: 10
  standardize: true
  normalize: false
model:
  class: UNSW_IoT_N3IC
  kwargs: {input_shape: 16, neurons: [64, 32, 10]}
  checkpoint: ../checkpoint/unsw-iot-in-network-dnn-5-classes.pt
labeler: {type: device_list}
stream: {window_size: 1000}
training: {epochs: 30, batch_size: 512, learning_rate: 0.01, optimizer: Adam, balance_binary: false}
adaptation:
  impact_threshold: 0.30
driftadapt:
  mode: driftadapt_selective
  min_labeled_samples: 64
  full_retrain_threshold: 0.70
  parameter_bits: 32
sample_selection: {enabled: true, max_samples: 64}
labeling:
  confidence_threshold: 0.95
  ood_threshold: 0.30
  fallback: oracle
replay: {enabled: true, capacity: 1000, samples_per_update: 256}
validation: {enabled: true, max_f1_drop: 0.02}
drift:
  bins: 16
  threshold: 0.10
  consecutive_windows: 3
  reference_windows: 5
drift_injection:
  enabled: false
  start_window: 7
  end_window: null  # Required for gradual and recurrent drift.
  type: abrupt
  feature_indices: [0, 1]
  feature_names: []
  magnitude: 2.0
# Used only by the baseline_caravan accuracy-proxy path.
trigger:
  type: accuracy_proxy
  threshold: 0.30
runtime: {device: cuda, seed: 42}
output: {directory: results}
