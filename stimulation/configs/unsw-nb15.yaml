dataset:
  name: unsw-nb15
  files: [../data/unsw-nb15.csv]
  feature_names:
    [dur, proto, sbytes, dbytes, sttl, dttl, sload, dload, spkts, dpkts,
     smean, dmean, sinpkt, dinpkt, tcprtt, synack, ackdat, ct_src_ltm,
     ct_dst_ltm, ct_dst_src_ltm]
  label_column: label
  num_classes: 2
  standardize: true
  normalize: false
model:
  class: ID_UNSW_NB15_N3IC
  kwargs: {input_shape: 20, neurons: [32, 16, 2]}
  checkpoint: ../checkpoint/unsw-nb15-in-network-dnn.pt
labeler:
  type: ollama
stream: {window_size: 100}
training: {epochs: 30, batch_size: 512, learning_rate: 0.01, optimizer: Adam, balance_binary: true}
adaptation:
  impact_threshold: 0.30
driftadapt:
  mode: driftadapt_selective
  min_labeled_samples: 64
  full_retrain_threshold: 0.70
  parameter_bits: 32
sample_selection: {enabled: true, max_samples: 64}
labeling:
  confidence_threshold: 0.95
  ood_threshold: 0.30
  fallback: oracle
replay: {enabled: true, capacity: 1000, samples_per_update: 256}
validation: {enabled: true, max_f1_drop: 0.02}
drift:
  bins: 16
  threshold: 0.10
  consecutive_windows: 3
  reference_windows: 10
drift_injection:
  enabled: false
  start_window: 20
  end_window: null  # Required for gradual and recurrent drift.
  type: abrupt
  feature_indices: [0, 1]
  feature_names: []
  magnitude: 2.0
# Used only by the baseline_caravan accuracy-proxy path.
trigger:
  type: accuracy_proxy
  threshold: 0.20
runtime: {device: cuda, seed: 42}
output: {directory: results}
