dataset:
  name: unsw-nb15
  files: [../data/unsw-nb15.csv]
  feature_names:
    [dur, proto, sbytes, dbytes, sttl, dttl, sload, dload, spkts, dpkts,
     smean, dmean, sinpkt, dinpkt, tcprtt, synack, ackdat, ct_src_ltm,
     ct_dst_ltm, ct_dst_src_ltm]
  label_column: label
  num_classes: 2
  standardize: true
  normalize: false
model:
  class: ID_UNSW_NB15_N3IC
  simulation_class: ID_UNSW_NB15_elastic_N3IC
  kwargs: {input_shape: 20, neurons: [32, 16, 2]}
  checkpoint: ../checkpoint/unsw-nb15-in-network-dnn.pt
labeler:
  type: ollama
stream: {window_size: 100}
training: {epochs: 30, batch_size: 512, learning_rate: 0.01, optimizer: Adam, balance_binary: true}
driftadapt:
  mode: caravan
  parameter_bits: 32
drift_conditioned:
  adapter_checkpoint: ../checkpoint/unsw-nb15-drift-adapter.pt
  simulation_adapter_checkpoint: ../checkpoint/unsw-nb15-capacity-drift-adapter.pt
  confidence_threshold: 0.50
  module_threshold: 0.50
  signature_shift_clip: 8.0
feature_reconfiguration:
  enabled: true
  active_feature_budget: 20
  minimum_oracle_gain: 0.02
  max_candidate_masks: 32
capacity:
  enabled: true
  initial_layer1: 32
  initial_layer2: 16
  max_layer1: 64
  max_layer2: 32
  residual_f1_threshold: 0.05
  saturation_threshold: 0.75
  layer1_expand_step: 8
  layer2_expand_step: 4
  min_improvement: 0.0
  contraction_enabled: true
  contraction_utility_threshold: 0.01
  contraction_patience: 10
  initialization_noise: 0.001
drift:
  bins: 16
  threshold: 0.10
  consecutive_windows: 3
  reference_windows: 10
drift_injection:
  enabled: false
  start_window: 20
  end_window: null  # Required for gradual and recurrent drift.
  type: abrupt
  feature_indices: [0, 1]
  feature_names: []
  magnitude: 2.0
# Used only by the CARAVAN accuracy-proxy path.
trigger:
  type: accuracy_proxy
  threshold: 0.20
runtime: {device: cuda, seed: 42}
output: {directory: results}
